<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x26be;</text></svg>">
<link rel="stylesheet" href="common.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<title>Live Standings - 2026 Season</title>
<!--
  This page is a static shell. Every number on it is read at load time from
  serve-playoff-odds, which reads DynamoDB, which is filled by
  snapshot-playoff-odds on an EventBridge schedule.

  Nothing regenerates this file. Editing it is a hand-edit and a commit; the
  data underneath moves on its own.
-->
<style>
  .banner {
    background: #1e293b; border: 1px solid #334155; border-left: 3px solid #38bdf8;
    border-radius: 10px; padding: 12px 16px; margin-bottom: 20px;
    font-size: 0.85em; color: #94a3b8; line-height: 1.5;
  }
  .banner strong { color: #e2e8f0; }

  .pf-row {
    display: grid; grid-template-columns: 42px 1fr 160px 130px;
    align-items: center; gap: 12px;
    background: #1e293b; border: 1px solid #334155; border-radius: 10px;
    padding: 10px 14px; margin-bottom: 6px;
  }
  .pf-row.cutline { margin-bottom: 18px; position: relative; }
  .pf-row.cutline::after {
    content: 'PLAYOFF CUT LINE'; position: absolute; left: 0; right: 0; bottom: -14px;
    text-align: center; font-size: 0.6em; font-weight: 800; letter-spacing: .14em;
    color: #ef4444;
  }
  .pf-row.clinched { border-color: #22c55e55; }
  .pf-row.out { opacity: .62; }
  .pf-row.longshot { opacity: .82; }
  .pf-seed { font-size: 1.3em; font-weight: 800; color: #64748b; text-align: center; }
  .pf-name { font-weight: 600; }
  .pf-name .mgr { color: #64748b; font-weight: 400; font-size: .85em; margin-left: 6px; }
  .pf-live { font-size: .8em; color: #94a3b8; margin-top: 3px; }
  .pf-live .sc { color: #fbbf24; font-weight: 700; font-variant-numeric: tabular-nums; }
  .pf-live .dim { color: #64748b; }
  .pf-note { font-size: .78em; color: #64748b; margin-top: 2px; }
  .pf-bar { height: 8px; background: #0f172a; border-radius: 4px; overflow: hidden; }
  .pf-bar span { display: block; height: 100%; background: linear-gradient(90deg,#3b82f6,#22c55e); }
  .pf-pct { font-size: .78em; color: #94a3b8; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .pf-chip { text-align: right; }

  .chip {
    display: inline-block; font-size: .62em; font-weight: 800; letter-spacing: .06em;
    padding: 3px 8px; border-radius: 4px; text-transform: uppercase; white-space: nowrap;
  }
  .chip.clinched { background: #22c55e22; color: #4ade80; border: 1px solid #22c55e55; }
  .chip.in       { background: #38bdf822; color: #38bdf8; border: 1px solid #38bdf855; }
  .chip.bubble   { background: #f59e0b22; color: #fbbf24; border: 1px solid #f59e0b55; }
  .chip.longshot { background: #94a3b822; color: #94a3b8; border: 1px solid #94a3b855; }
  .chip.out      { background: #ef444422; color: #f87171; border: 1px solid #ef444455; }

  table.standings td { font-variant-numeric: tabular-nums; }
  table.standings tr.out td { opacity: .62; }
  table.standings tr.longshot td { opacity: .82; }
  .team-name { text-align: left; font-weight: 600; }
  .team-name .mgr { color: #64748b; font-weight: 400; font-size: .85em; margin-left: 6px; }
  td.pts { font-weight: 700; color: #34d399; }
  td.live { color: #fbbf24; font-weight: 600; }
  td.live .of { color: #64748b; font-weight: 400; font-size: .82em; }
  td.bank { color: #e2e8f0; font-weight: 600; }
  td.ceil, td.gb { color: #94a3b8; font-size: .9em; }
  td.proj { color: #c4b5fd; font-weight: 600; }
  td.odds { font-weight: 700; }

  .chart-wrap {
    height: 380px; background: #1e293b; border: 1px solid #334155;
    border-radius: 12px; padding: 18px 18px 14px; margin-bottom: 8px;
  }
  @media (max-width: 720px) { .chart-wrap { height: 320px; padding: 12px 10px 10px; } }

  .mu-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(340px,1fr)); gap: 12px; }
  .mu { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 14px 16px; }
  .mu.key { border-color: #3b82f6; }
  .mu-stakes { font-size: .72em; text-transform: uppercase; letter-spacing: .06em;
                color: #64748b; font-weight: 700; margin-bottom: 10px; }
  .mu.key .mu-stakes { color: #60a5fa; }
  .mu-head { display: flex; align-items: center; gap: 10px; }
  .mu-side { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
  .mu-side.r { align-items: flex-end; text-align: right; }
  .mu-name { font-size: .92em; font-weight: 600; overflow-wrap: anywhere; }
  .mu-rec { font-size: .74em; color: #64748b; }
  .mu-score { font-size: 1.5em; font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .mu-score .winner { color: #22c55e; }
  .mu-score .loser { color: #ef4444; }
  .mu-score .tied { color: #fbbf24; }
  .mu-score .sep { color: #64748b; margin: 0 5px; }
  .mu-foot { margin-top: 10px; font-size: .74em; color: #64748b; }

  .state { color: #64748b; text-align: center; padding: 40px 16px; font-size: .95em; }
  .state.err { color: #f87171; }
  .state .again {
    display: inline-block; margin-top: 12px; padding: 6px 14px; cursor: pointer;
    background: #1e293b; border: 1px solid #334155; border-radius: 6px; color: #e2e8f0;
    font: inherit; font-size: .9em;
  }

  @media (max-width: 720px) {
    .pf-row { grid-template-columns: 32px 1fr 90px; }
    .pf-chip { display: none; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>Live Standings</h1>
  <div class="page-subtitle" id="subtitle">Loading…</div>
  <div id="page"><div class="state">Fetching the live picture…</div></div>
</div>

<script>
(function () {
  'use strict';

  var ENDPOINT = 'https://q4v6yvzalnkcvr6sppapaxd3ze0eidiz.lambda-url.us-west-2.on.aws/';
  var CATS = 12;
  var RACE_COLORS = ['#38bdf8', '#a78bfa', '#fbbf24', '#34d399', '#f87171', '#f472b6'];
  var chart = null;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // Only the clinch maths earns a round 100 - the simulation agreeing
  // 100,000 times out of 100,000 is not the same as being unable to miss.
  function oddsValue(t) {
    if (t.eliminated) return 0;
    if (t.clinched) return 100;
    return Math.min(t.odds, 99.9);
  }

  function fmtOdds(t) {
    var o = oddsValue(t);
    if (t.eliminated) return '0.0%';
    if (t.clinched) return '100%';
    if (o < 0.05) return '<0.1%';
    return o.toFixed(1) + '%';
  }

  function fmtPts(v) {
    return v % 1 === 0 ? v.toFixed(0) : v.toFixed(1);
  }

  function statusChip(t) {
    if (t.clinched) return ['clinched', 'CLINCHED'];
    if (t.eliminated) return ['out', 'ELIMINATED'];
    if (t.odds >= 50) return ['in', 'IN THE HUNT'];
    if (t.odds < 1) return ['longshot', 'ALIVE ON PAPER'];
    return ['bubble', 'ON THE BUBBLE'];
  }

  // The requirement and the live score have to be quoted on the same basis, or
  // the card lies by juxtaposition: "needs 6" beside a 9-2 lead reads as "needs
  // 6 more", when 6 is the target and the 9 already clears it.
  function stakeLine(t) {
    if (t.clinched || t.eliminated) return '';
    var need, verb;
    if (t.magic !== null && t.magic !== undefined) {
      need = t.magic; verb = 'clinches with';
    } else if (t.need_alive) {
      need = t.need_alive; verb = 'needs';
    } else {
      return t.name + ' is fighting for the last spot';
    }
    var target = need >= t.remaining
      ? 'needs all ' + t.remaining + ' this week ' +
        (verb === 'clinches with' ? 'to clinch' : 'to stay alive')
      : verb + ' ' + need + " of this week's " + t.remaining;
    var pace = t.live >= need ? 'already there' : 'leads ' + t.live;
    return t.name + ' ' + target + ' — ' + pace;
  }

  function noteFor(t) {
    if (t.clinched) return 'Locked in — playing for seeding';
    if (t.eliminated) return 'Eliminated from the playoff race';
    var word = t.remaining === 1 ? 'category' : 'categories';
    if (t.magic !== null && t.magic !== undefined) {
      return 'Clinches with ' + t.magic + ' of the ' + t.remaining + ' ' + word +
             ' left this week — ' +
             (t.live >= t.magic ? 'leading enough right now' : 'leading ' + t.live);
    }
    if (t.need_alive) {
      return 'Needs ' + t.need_alive + ' of the ' + t.remaining +
             ' left this week just to stay alive — ' +
             (t.live >= t.need_alive ? 'leading enough right now' : 'leading ' + t.live);
    }
    if (t.need_alive === 0) {
      return 'Cannot be caught by the maths yet — but cannot lock it up either';
    }
    return 'Needs help elsewhere';
  }

  function mgrSpan(t) {
    return t.manager ? ' <span class="mgr">' + esc(t.manager) + '</span>' : '';
  }

  function renderCards(order, spots, byId) {
    return order.map(function (t, i) {
      var cs = statusChip(t), seed = i + 1;
      var opp = byId[t.opponent];
      var live = opp
        ? '<span class="sc">' + t.live + '–' + opp.live + '</span> vs ' + esc(opp.name) +
          '<span class="dim"> · ' + fmtPts(t.pts) + ' banked → ' +
          fmtPts(t.pts + t.live) + ' live</span>'
        : '<span class="dim">no matchup this week · ' + fmtPts(t.pts) + ' banked</span>';
      return '<div class="pf-row ' + cs[0] + (seed === spots ? ' cutline' : '') + '">' +
        '<div class="pf-seed">' + seed + '</div>' +
        '<div class="pf-main">' +
          '<div class="pf-name">' + esc(t.name) + mgrSpan(t) + '</div>' +
          '<div class="pf-live">' + live + '</div>' +
          '<div class="pf-note">' + esc(noteFor(t)) + '</div>' +
        '</div>' +
        '<div class="pf-odds">' +
          '<div class="pf-bar"><span style="width:' + oddsValue(t).toFixed(1) + '%"></span></div>' +
          '<div class="pf-pct">' + esc(fmtOdds(t)) + '</div>' +
        '</div>' +
        '<div class="pf-chip"><span class="chip ' + cs[0] + '">' + cs[1] + '</span></div>' +
      '</div>';
    }).join('');
  }

  function renderTable(order, week, spots) {
    var leader = order[0].pts + order[0].live;   // live, same basis as the ranking
    var rows = order.map(function (t, i) {
      var cs = statusChip(t), gb = leader - (t.pts + t.live);
      return '<tr class="' + cs[0] + '">' +
        '<td class="rank">' + (i + 1) + '</td>' +
        '<td class="team-name">' + esc(t.name) + mgrSpan(t) + '</td>' +
        '<td>' + t.wins + '-' + t.losses + '-' + t.ties + '</td>' +
        '<td class="bank">' + fmtPts(t.pts) + '</td>' +
        '<td class="live">' + t.live + '<span class="of">/' + CATS + '</span></td>' +
        '<td class="pts">' + fmtPts(t.pts + t.live) + '</td>' +
        '<td class="gb">' + (gb === 0 ? '—' : fmtPts(gb)) + '</td>' +
        '<td class="proj">' + t.projected.toFixed(1) + '</td>' +
        '<td class="ceil">' + fmtPts(t.floor) + ' – ' + fmtPts(t.ceiling) + '</td>' +
        '<td class="odds">' + esc(fmtOdds(t)) + '</td>' +
        '<td><span class="chip ' + cs[0] + '">' + cs[1] + '</span></td>' +
      '</tr>';
    }).join('');

    return '<div style="overflow-x:auto;"><table class="standings"><thead><tr>' +
      '<th>#</th><th style="text-align:left">Team</th><th>W-L-T</th>' +
      '<th title="Category points actually banked through week ' + (week - 1) +
        ' — this is what Yahoo ranks on, and what the playoff odds start from">Bank</th>' +
      '<th title="Of this week\'s 12 categories, how many this team leads right now. ' +
        'Both teams in a matchup have some — they split the 12. None of it has banked.">' +
        'Leading</th>' +
      '<th title="Bank + Live. The table sorts on this, but the odds do not treat ' +
        'the Live half as real yet">Pts</th>' +
      '<th>GB</th>' +
      '<th title="Average finish across the simulations">Proj</th>' +
      '<th title="Worst case - best case finish, with every live category still winnable">Range</th>' +
      '<th title="Chance of finishing in the top ' + spots + '">Playoff&nbsp;%</th>' +
      '<th>Status</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  function renderMatchups(matchups, byId, weekPct) {
    return matchups.map(function (m) {
      var a = byId[m.a.team_id], b = byId[m.b.team_id];
      if (!a || !b) return '';
      var stakes = [stakeLine(a), stakeLine(b)].filter(Boolean);
      var stakeTxt = stakes.length ? stakes.join(' · ') : 'No bearing on the cut line';

      // decided counts the categories that currently have a leader, so the only
      // thing it tells the reader is how many are still level
      var tied = CATS - m.decided;
      var tiedTxt = tied
        ? tied + ' categor' + (tied === 1 ? 'y' : 'ies') + ' still level'
        : 'All ' + CATS + ' categories have a leader';

      function cls(x, y) { return x > y ? 'winner' : x < y ? 'loser' : 'tied'; }

      return '<div class="mu' + (stakes.length ? ' key' : '') + '">' +
        '<div class="mu-stakes">' + esc(stakeTxt) + '</div>' +
        '<div class="mu-head">' +
          '<div class="mu-side"><span class="mu-name">' + esc(a.name) + '</span>' +
            '<span class="mu-rec">' + a.wins + '-' + a.losses + '-' + a.ties + '</span></div>' +
          '<div class="mu-score"><span class="' + cls(a.live, b.live) + '">' + a.live + '</span>' +
            '<span class="sep">–</span><span class="' + cls(b.live, a.live) + '">' + b.live + '</span></div>' +
          '<div class="mu-side r"><span class="mu-name">' + esc(b.name) + '</span>' +
            '<span class="mu-rec">' + b.wins + '-' + b.losses + '-' + b.ties + '</span></div>' +
        '</div>' +
        '<div class="mu-foot">' + tiedTxt + ' · ' + weekPct +
          ' of the week played · nothing banks until the week ends</div>' +
      '</div>';
    }).join('');
  }

  function drawChart(points, tracked, byId) {
    var ids = tracked.filter(function (id) { return byId[id]; })
                     .sort(function (x, y) { return oddsValue(byId[y]) - oddsValue(byId[x]); });
    if (!ids.length || !points.length) return;

    var datasets = ids.map(function (id, i) {
      var t = byId[id];
      return {
        label: t.name + (t.manager ? ' (' + t.manager + ')' : ''),
        data: points.map(function (p) {
          var v = p.odds[String(id)];
          return v === undefined ? null : v;
        }),
        borderColor: RACE_COLORS[i % RACE_COLORS.length],
        backgroundColor: RACE_COLORS[i % RACE_COLORS.length],
        borderWidth: 2.5,
        // monotone rounds the corners without letting the curve overshoot -
        // plain tension would arc a 100-to-100 stretch up past 100, and with
        // clipping off that overshoot would actually be visible
        cubicInterpolationMode: 'monotone',
        borderJoinStyle: 'round',
        borderCapStyle: 'round',
        pointRadius: 3,
        pointHoverRadius: 6,
        spanGaps: true,
        clip: false
      };
    });

    var titles = points.map(function (p) { return p.label + ' · week ' + p.week; });
    if (chart) chart.destroy();
    chart = new Chart(document.getElementById('raceChart'), {
      type: 'line',
      data: { labels: points.map(function (p) { return p.label; }), datasets: datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        // room above 100 and below 0 for the dots to sit whole
        layout: { padding: { top: 14, bottom: 14, left: 4, right: 10 } },
        scales: {
          y: {
            min: 0, max: 100,
            ticks: { color: '#64748b', stepSize: 20, padding: 8,
                     callback: function (v) { return v + '%'; } },
            grid: { color: '#1e293b' }
          },
          x: {
            ticks: { color: '#64748b', maxRotation: 60, autoSkip: true, maxTicksLimit: 16 },
            grid: { display: false }
          }
        },
        plugins: {
          legend: { labels: { color: '#cbd5e1', usePointStyle: true,
                              pointStyle: 'line', boxWidth: 26 } },
          tooltip: {
            callbacks: {
              title: function (items) { return titles[items[0].dataIndex] || ''; },
              label: function (c) {
                return c.dataset.label + ': ' +
                       (c.parsed.y == null ? 'n/a' : c.parsed.y.toFixed(1) + '%');
              }
            }
          }
        }
      }
    });
  }

  function render(data) {
    var cur = data.current;
    if (!cur) throw new Error('no current standings in the response');

    // Two orderings, because they answer two different questions and mixing
    // them is what made Greg show below Bryant while being likelier to make it.
    //   byBank - what Yahoo ranks on. Banked categories only, no live lead.
    //   byOdds - who actually makes the field, which is not the same thing.
    // This is the LIVE standings page: rank on what a team has right now,
    // banked plus the categories it is currently leading. The Bank column is
    // there so the difference is visible, not so the table hides behind it.
    var teams = cur.teams.slice().sort(function (x, y) {
      return (y.pts + y.live) - (x.pts + x.live) || y.pts - x.pts;
    });
    var byOdds = cur.teams.slice().sort(function (x, y) {
      return oddsValue(y) - oddsValue(x) || y.pts - x.pts;
    });
    var byId = {};
    teams.forEach(function (t) { byId[t.team_id] = t; });

    var spots = cur.playoff_spots;
    var weekPct = Math.round(cur.week_progress * 100) + '%';
    var tracked = (data.tracked || []).filter(function (id) { return byId[id]; });

    document.getElementById('subtitle').textContent =
      'Week ' + cur.week + ' · ' + cur.status + ' · ' + spots + '-team playoff field';

    var chartSection = '';
    if (tracked.length && data.points.length) {
      var names = tracked.map(function (id) { return esc(byId[id].name); }).join(', ');
      var n = data.points.length;
      chartSection =
        '<h2>Race for the Last Playoff Spots</h2>' +
        '<div class="section-desc">' + names + ' — chasing the ' + spots +
        '-team field. Snapshotted at midnight, noon, 3pm, 6pm and 9pm every day · ' +
        n + ' snapshot' + (n === 1 ? '' : 's') + ' so far' +
        (n < 2 ? ' — the line fills in from here' : '') + '</div>' +
        '<div class="chart-wrap"><canvas id="raceChart"></canvas></div>';
    }

    document.getElementById('page').innerHTML =
      '<div class="banner">' +
        '<strong>Where this comes from:</strong> the Yahoo Fantasy API has been dead since late ' +
        'July, so this is scraped from the public league page by a scheduled AWS job. Standings ' +
        'are Yahoo\'s through week ' + (cur.week - 1) + ' (' + esc(cur.yahoo_updated) + '); the ' +
        '<strong>Live</strong> column is week ' + cur.week + '\'s category leads <em>right now</em> ' +
        '— none of that is banked, a category can flip any day until the week closes, so every ' +
        'live category is still treated as winnable in the maths. Playoff odds run the rest of ' +
        'the season ' + cur.sims.toLocaleString() + ' times, holding each current lead in ' +
        'proportion to the ' + weekPct + ' of the week already played and playing out the rest ' +
        'on each team\'s season category win rate.' +
        '<br><strong>Bank vs Live:</strong> the table sorts on Bank + Live, but only Bank is actually banked. A team can show inside the cut line on a live lead and still carry low odds, because the odds start from Bank and treat the live lead as worth only the share of the week already played.' +
        '<br><strong>Playoff format:</strong> ' + esc(cur.playoff_format) + '. ' +
        'Data refreshes every 10 minutes; the race chart gains a point at midnight, noon, 3pm, ' +
        '6pm and 9pm. Last scrape ' + esc(cur.scraped_at.replace('T', ' ')) + '.' +
      '</div>' +
      '<h2>Playoff Picture</h2>' +
      '<div class="section-desc">Ordered by odds of making the field, which is not the ' +
        'same as the live order below — each row shows the live score driving it.</div>' +
      renderCards(byOdds, spots, byId) +
      chartSection +
      '<h2>Standings</h2>' +
      '<div class="section-desc">Live order — Bank + Leading, where everyone stands ' +
      'right now. <strong>Bank</strong> is what has actually banked (the order Yahoo ' +
      'shows). <strong>Leading</strong> is how many of this week\'s 12 categories a ' +
      'team is ahead in; the two teams in a matchup split those 12, so everyone has ' +
      'some. Playoff % starts from Bank, which is why it can disagree with this order.' +
      '</div>' +
      renderTable(teams, cur.week, spots) +
      '<h2>Week ' + cur.week + ' Matchups</h2>' +
      '<div class="section-desc">Live category scores — ' + esc(cur.status) + '</div>' +
      '<div class="mu-grid">' + renderMatchups(cur.matchups, byId, weekPct) + '</div>';

    if (chartSection) drawChart(data.points, tracked, byId);
  }

  function fail(msg) {
    if (chart) { chart.destroy(); chart = null; }
    document.getElementById('subtitle').textContent = '2026 Season';
    document.getElementById('page').innerHTML =
      '<div class="state err">Could not load the live standings.<br>' + esc(msg) +
      '<br><button class="again" id="again">Try again</button></div>';
    document.getElementById('again').onclick = load;
  }

  function load() {
    // cache-bust so a refresh never shows the copy the browser already had
    fetch(ENDPOINT + '?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(render)
      .catch(function (e) { fail(e.message || String(e)); });
  }

  load();
  setInterval(load, 5 * 60 * 1000);   // the data behind it moves every 10
})();
</script>
<script src="nav.js"></script>
</body>
</html>
