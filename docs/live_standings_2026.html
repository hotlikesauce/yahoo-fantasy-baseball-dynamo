<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x26be;</text></svg>">
<link rel="stylesheet" href="common.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<title>Live Standings - 2026 Season</title>
<!--
  Static shell. Every number is read at load time from serve-playoff-odds,
  which reads DynamoDB, which snapshot-playoff-odds fills on a schedule.

  Three scenarios arrive with every payload - "now", "likely" and "adjusted" -
  each fully simulated server-side. The selector just swaps which one every
  section renders from; nothing is recomputed in the browser.
-->
<style>
  .toolbar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    background: #1e293b; border: 1px solid #334155; border-radius: 10px;
    padding: 12px 16px; margin-bottom: 18px;
  }
  .toolbar .lbl { font-weight: 700; font-size: .9em; color: #e2e8f0; }
  .seg {
    font: inherit; font-size: .82em; font-weight: 600; cursor: pointer;
    padding: 6px 12px; border: 1px solid #334155; background: #0f172a;
    color: #94a3b8; margin-right: -1px;
  }
  .seg:first-of-type { border-radius: 6px 0 0 6px; }
  .seg:last-of-type { border-radius: 0 6px 6px 0; margin-right: 0; }
  .seg:hover { color: #e2e8f0; }
  .seg.on { background: #b45309; border-color: #b45309; color: #fff; }
  .toolbar .hint { color: #64748b; font-size: .8em; }
  .toolbar .warn { color: #fbbf24; font-weight: 600; font-size: .82em; }
  body.adj .toolbar { border-color: #b45309; background: #1f1a10; }

  .short-list { font-size: .82em; color: #94a3b8; margin: -8px 0 18px; line-height: 1.6; }
  .short-list b { color: #fbbf24; }
  .short-list .ok { color: #4ade80; }

  table.standings td { font-variant-numeric: tabular-nums; }
  table.standings tr.out td { opacity: .55; }
  table.standings tr.cut td { border-bottom: 2px solid #ef4444; }
  .team-name { text-align: left; font-weight: 600; }
  .team-name .mgr { color: #64748b; font-weight: 400; font-size: .85em; margin-left: 6px; }
  td.pts { font-weight: 700; color: #34d399; }
  td.live { color: #fbbf24; font-weight: 600; }
  td.live .of { color: #64748b; font-weight: 400; font-size: .82em; }
  td.bank { color: #e2e8f0; font-weight: 600; }
  td.gb, td.ceil { color: #94a3b8; font-size: .9em; }
  td.proj { color: #c4b5fd; font-weight: 600; }
  td.odds { font-weight: 700; }
  td.ip { font-variant-numeric: tabular-nums; }
  td.ip.short { color: #f87171; font-weight: 700; }
  td.ip.okay { color: #4ade80; }
  td.ip.unk { color: #475569; }
  .pf-ip.unk { color: #475569; }
  .short-list .unk { color: #64748b; }
  td.delta.up { color: #4ade80; font-weight: 700; }
  td.delta.down { color: #f87171; font-weight: 700; }
  td.delta.same { color: #475569; }

  .pf-row {
    display: grid; grid-template-columns: 42px 1fr 230px 130px;
    align-items: center; gap: 12px;
    background: #1e293b; border: 1px solid #334155; border-radius: 10px;
    padding: 10px 14px; margin-bottom: 6px;
  }
  .pf-row.cutline { margin-bottom: 20px; position: relative; }
  .pf-row.cutline::after {
    content: 'PLAYOFF CUT LINE'; position: absolute; left: 0; right: 0; bottom: -15px;
    text-align: center; font-size: .6em; font-weight: 800; letter-spacing: .14em; color: #ef4444;
  }
  .pf-row.clinched { border-color: #22c55e55; }
  .pf-row.out { opacity: .6; }
  .pf-seed { font-size: 1.3em; font-weight: 800; color: #64748b; text-align: center; }
  .pf-name { font-weight: 600; }
  .pf-name .mgr { color: #64748b; font-weight: 400; font-size: .85em; margin-left: 6px; }
  .pf-live { font-size: .8em; color: #94a3b8; margin-top: 3px; }
  .pf-live .sc { color: #fbbf24; font-weight: 700; font-variant-numeric: tabular-nums; }
  .pf-live .dim { color: #64748b; }
  .pf-note { font-size: .78em; color: #64748b; margin-top: 2px; }
  .pf-ip { font-size: .76em; margin-top: 3px; }
  .pf-ip.short { color: #f87171; }
  .pf-ip.okay { color: #4ade80; }
  .pf-bar { height: 8px; background: #0f172a; border-radius: 4px; overflow: hidden; }
  .pf-bar span { display: block; height: 100%; background: linear-gradient(90deg,#3b82f6,#22c55e); }
  .pf-two { display: grid; grid-template-columns: 52px 1fr 62px; align-items: center;
            gap: 7px; font-size: .74em; margin-bottom: 4px; }
  .pf-two .tag { color: #64748b; text-transform: uppercase; letter-spacing: .04em;
                 font-weight: 700; font-size: .92em; }
  .pf-two .val { text-align: right; color: #cbd5e1; font-weight: 700;
                 font-variant-numeric: tabular-nums; }
  .pf-two.alt .pf-bar span { background: linear-gradient(90deg,#92400e,#b45309); }
  .pf-two.alt .tag { color: #b45309; }
  .pf-two.alt.moved .tag, .pf-two.alt.moved .val { color: #fbbf24; }
  .pf-chip { text-align: right; }

  .chip {
    display: inline-block; font-size: .62em; font-weight: 800; letter-spacing: .06em;
    padding: 3px 8px; border-radius: 4px; text-transform: uppercase; white-space: nowrap;
  }
  .chip.clinched { background: #22c55e22; color: #4ade80; border: 1px solid #22c55e55; }
  .chip.in       { background: #38bdf822; color: #38bdf8; border: 1px solid #38bdf855; }
  .chip.bubble   { background: #f59e0b22; color: #fbbf24; border: 1px solid #f59e0b55; }
  .chip.longshot { background: #94a3b822; color: #94a3b8; border: 1px solid #94a3b855; }
  .chip.out      { background: #ef444422; color: #f87171; border: 1px solid #ef444455; }

  .chart-wrap {
    height: 440px; background: #1e293b; border: 1px solid #334155;
    border-radius: 12px; padding: 18px 18px 14px; margin-bottom: 8px;
  }
  @media (max-width: 720px) { .chart-wrap { height: 340px; padding: 12px 10px 10px; } }

  .mu-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(340px,1fr)); gap: 12px; }
  .mu { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 14px 16px; }
  .mu.key { border-color: #3b82f6; }
  .mu-stakes { font-size: .72em; text-transform: uppercase; letter-spacing: .06em;
               color: #64748b; font-weight: 700; margin-bottom: 10px; }
  .mu.key .mu-stakes { color: #60a5fa; }
  .mu-head { display: flex; align-items: center; gap: 10px; }
  .mu-side { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
  .mu-side.r { align-items: flex-end; text-align: right; }
  .mu-name { font-size: .92em; font-weight: 600; overflow-wrap: anywhere; }
  .mu-rec { font-size: .74em; color: #64748b; }
  .mu-ip { font-size: .72em; }
  .mu-ip.short { color: #f87171; }
  .mu-ip.okay { color: #4ade80; }
  .mu-score { font-size: 1.5em; font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .mu-score .winner { color: #22c55e; }
  .mu-score .loser { color: #ef4444; }
  .mu-score .tied { color: #fbbf24; }
  .mu-score .sep { color: #64748b; margin: 0 5px; }
  .mu-foot { margin-top: 10px; font-size: .74em; color: #64748b; }

  .banner {
    background: #1e293b; border: 1px solid #334155; border-left: 3px solid #38bdf8;
    border-radius: 10px; padding: 12px 16px; margin-bottom: 20px;
    font-size: .85em; color: #94a3b8; line-height: 1.55;
  }
  .banner strong { color: #e2e8f0; }
  .state { color: #64748b; text-align: center; padding: 40px 16px; font-size: .95em; }
  .state.err { color: #f87171; }
  .state .again {
    display: inline-block; margin-top: 12px; padding: 6px 14px; cursor: pointer;
    background: #1e293b; border: 1px solid #334155; border-radius: 6px; color: #e2e8f0;
    font: inherit; font-size: .9em;
  }
  @media (max-width: 720px) {
    .pf-row { grid-template-columns: 28px 1fr 150px; }
    .pf-chip { display: none; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>Live Standings</h1>
  <div class="page-subtitle" id="subtitle">Loading…</div>
  <div id="page"><div class="state">Fetching the live picture…</div></div>
</div>

<script>
(function () {
  'use strict';

  var ENDPOINT = 'https://q4v6yvzalnkcvr6sppapaxd3ze0eidiz.lambda-url.us-west-2.on.aws/';
  var CATS = 12;
  var chart = null;
  var DATA = null;
  // Two independent selections: the top filters drive the standings table,
  // the tracker carries its own copy. Table 2 answers to neither - it always
  // shows as-is against the full-forfeit case, stacked.
  var pick = {};        // team_id -> true, for the standings
  var pickChart = {};   // team_id -> true, for the race tracker

  function keyOf(sel) {
    var ids = Object.keys(sel).filter(function (k) { return sel[k]; })
                    .map(Number).sort(function (a, b) { return a - b; });
    return ids.length ? ids.join('-') : 'none';
  }
  function scenarioFor(sel) {
    var sc = DATA.current.scenarios;
    return sc[keyOf(sel)] || sc.none;
  }

  // One hue per team: solid + vibrant for points, muted + dashed for odds.
  var TEAM_COLORS = {
    9:  { pts: '#fbbf24', odds: '#a1802f' },   // Greg
    4:  { pts: '#a78bfa', odds: '#6d5f9c' },   // Bryant
    2:  { pts: '#34d399', odds: '#2f7f68' },   // James
  };
  var FALLBACK = [
    { pts: '#38bdf8', odds: '#31708f' },
    { pts: '#f87171', odds: '#9c4c4c' },
    { pts: '#f472b6', odds: '#96486f' },
  ];

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function oddsValue(t) {
    if (t.eliminated) return 0;
    if (t.clinched) return 100;
    return t.odds;
  }
  // Print the real number, with as many decimals as it takes to stay honestly
  // below 100. Clamping would invent a value a team does not have.
  function fmtPct(o) {
    for (var dp = 1; dp <= 4; dp++) {
      var s = o.toFixed(dp);
      if (parseFloat(s) < 100) return s + '%';
    }
    return '>99.99%';
  }
  function fmtOdds(t) {
    if (t.eliminated) return '0.0%';
    if (t.clinched) return '100%';
    if (t.odds < 0.05) return '<0.1%';
    return fmtPct(t.odds);
  }
  function fmtPts(v) { return v % 1 === 0 ? v.toFixed(0) : v.toFixed(1); }
  function statusChip(t) {
    if (t.clinched) return ['clinched', 'CLINCHED'];
    if (t.eliminated) return ['out', 'ELIMINATED'];
    if (t.odds >= 50) return ['in', 'IN THE HUNT'];
    if (t.odds < 1) return ['longshot', 'ALIVE ON PAPER'];
    return ['bubble', 'ON THE BUBBLE'];
  }
  function mgrSpan(t) {
    return t.manager ? ' <span class="mgr">' + esc(t.manager) + '</span>' : '';
  }
  function scen() { return scenarioFor(pick); }
  function asIs() { return DATA.current.scenarios.none; }
  function allForfeit() { return DATA.current.scenarios[DATA.current.all_key] ||
                                 DATA.current.scenarios.none; }
  function other() { return keyOf(pick) === 'none' ? allForfeit() : asIs(); }

  function byLive(list) {
    return list.slice().sort(function (x, y) {
      return (y.pts + y.live) - (x.pts + x.live) || y.pts - x.pts;
    });
  }
  function indexById(list) {
    var m = {}; list.forEach(function (t) { m[t.team_id] = t; }); return m;
  }

  // ---------- 1. live standings -----------------------------------------
  function renderStandings(teams, spots, week) {
    var order = byLive(teams);
    var prev = indexById(other().teams);
    var leader = order[0].pts + order[0].live;
    var rows = order.map(function (t, i) {
      var cs = statusChip(t);
      var gb = leader - (t.pts + t.live);
      var p = prev[t.team_id];
      var d = p ? (t.pts + t.live) - (p.pts + p.live) : 0;
      var dcls = d > 0 ? 'up' : d < 0 ? 'down' : 'same';
      var dtxt = d === 0 ? '—' : (d > 0 ? '+' : '') + fmtPts(d);
      var ipKnown = t.meets_min_ip !== null && t.meets_min_ip !== undefined;
      var ipCls = !ipKnown ? 'unk' : t.meets_min_ip ? 'okay' : 'short';
      return '<tr class="' + (t.eliminated ? 'out ' : '') + (i + 1 === spots ? 'cut' : '') + '">' +
        '<td>' + (i + 1) + '</td>' +
        '<td class="team-name">' + esc(t.name) + mgrSpan(t) + '</td>' +
        '<td>' + t.wins + '-' + t.losses + '-' + t.ties + '</td>' +
        '<td class="bank">' + fmtPts(t.pts) + '</td>' +
        '<td class="live">' + t.live + '<span class="of">/' + CATS + '</span></td>' +
        '<td class="pts">' + fmtPts(t.pts + t.live) + '</td>' +
        '<td class="gb">' + (gb === 0 ? '—' : fmtPts(gb)) + '</td>' +
        '<td class="ip ' + ipCls + '">' +
          (!ipKnown ? '—'
            : esc(t.ip_raw) + (t.meets_min_ip ? ''
                : ' <span style="font-size:.85em">(−' + t.ip_short + ')</span>')) +
        '</td>' +
        '<td class="delta ' + dcls + '">' + dtxt + '</td>' +
        '<td><span class="chip ' + cs[0] + '">' + cs[1] + '</span></td>' +
      '</tr>';
    }).join('');

    return '<div style="overflow-x:auto;"><table class="standings"><thead><tr>' +
      '<th>#</th><th style="text-align:left">Team</th><th>W-L-T</th>' +
      '<th title="Category points banked through week ' + (week - 1) + '">Bank</th>' +
      '<th title="Categories led in week ' + week + ' right now, out of 12">Leading</th>' +
      '<th title="Bank + Leading">Pts</th><th>GB</th>' +
      '<th title="Innings pitched this week. Red means short of the ' +
        DATA.current.min_ip + '-inning minimum, with the shortfall in brackets.">IP</th>' +
      '<th title="How this row changes under the other scenario">' +
        (keyOf(pick) === 'none' ? 'vs forfeits' : 'vs as-is') + '</th>' +
      '<th>Status</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  // ---------- 2. playoff picture ----------------------------------------
  function noteFor(t) {
    if (t.clinched) return 'Locked in — playing for seeding';
    if (t.eliminated) return 'Eliminated from the playoff race';
    var word = t.remaining === 1 ? 'category' : 'categories';
    if (t.magic !== null && t.magic !== undefined) {
      return 'Clinches with ' + t.magic + ' of the ' + t.remaining + ' ' + word +
             ' left — ' + (t.live >= t.magic ? 'leading enough right now' : 'leading ' + t.live);
    }
    if (t.need_alive) {
      return 'Needs ' + t.need_alive + ' of the ' + t.remaining +
             ' left just to stay alive — ' +
             (t.live >= t.need_alive ? 'leading enough right now' : 'leading ' + t.live);
    }
    if (t.need_alive === 0) return 'Cannot be caught yet — cannot lock it up either';
    return 'Needs help elsewhere';
  }

  function renderPicture(spots) {
    // Deliberately ignores the top filters. This table answers one question:
    // where does everyone stand now, and where would they stand if every
    // unreachable team forfeited. Both bars, always, side by side.
    var A = indexById(asIs().teams);
    var B = indexById(allForfeit().teams);
    var order = asIs().teams.slice().sort(function (x, y) {
      return oddsValue(y) - oddsValue(x) || y.pts - x.pts;
    });
    return order.map(function (t, i) {
      var a = A[t.team_id], b = B[t.team_id] || a;
      var cs = statusChip(a), seed = i + 1;
      var opp = A[a.opponent];
      var oppB = B[a.opponent];
      var moved = Math.abs(oddsValue(b) - oddsValue(a)) >= 0.05;
      var ipTxt = (a.meets_min_ip === null || a.meets_min_ip === undefined)
        ? 'IP not published for the live week'
        : a.meets_min_ip
          ? 'IP ' + esc(a.ip_raw) + ' — over the ' + DATA.current.min_ip + ' minimum'
          : 'IP ' + esc(a.ip_raw) + ' — <b>' + a.ip_short + ' short</b>' +
            (a.is_candidate ? ' (cannot reach it today)' : ' (reachable)');
      return '<div class="pf-row ' + cs[0] + (seed === spots ? ' cutline' : '') + '">' +
        '<div class="pf-seed">' + seed + '</div>' +
        '<div class="pf-main">' +
          '<div class="pf-name">' + esc(a.name) + mgrSpan(a) + '</div>' +
          '<div class="pf-live">' +
            (opp ? '<span class="sc">' + a.live + '–' + opp.live + '</span> vs ' + esc(opp.name)
                 : '<span class="dim">no matchup</span>') +
            (moved && oppB ? '<span class="dim"> → ' + b.live + '–' + oppB.live +
                             ' with forfeits</span>' : '') +
          '</div>' +
          '<div class="pf-ip ' + (a.meets_min_ip === null || a.meets_min_ip === undefined
              ? 'unk' : a.meets_min_ip ? 'okay' : 'short') + '">' + ipTxt + '</div>' +
          '<div class="pf-note">' + esc(noteFor(a)) + '</div>' +
        '</div>' +
        '<div class="pf-odds">' +
          '<div class="pf-two">' +
            '<span class="tag">as-is</span>' +
            '<div class="pf-bar"><span style="width:' + oddsValue(a).toFixed(1) + '%"></span></div>' +
            '<span class="val">' + esc(fmtOdds(a)) + '</span>' +
          '</div>' +
          '<div class="pf-two alt' + (moved ? ' moved' : '') + '">' +
            '<span class="tag">forfeits</span>' +
            '<div class="pf-bar"><span style="width:' + oddsValue(b).toFixed(1) + '%"></span></div>' +
            '<span class="val">' + esc(fmtOdds(b)) + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="pf-chip"><span class="chip ' + cs[0] + '">' + cs[1] + '</span></div>' +
      '</div>';
    }).join('');
  }

  // ---------- 3. tracker chart ------------------------------------------
  function drawChart(points, tracked, byId) {
    var key = keyOf(pickChart);
    var ids = tracked.filter(function (id) { return byId[id]; });
    if (!ids.length || !points.length) return;

    var datasets = [];
    ids.forEach(function (id, i) {
      var t = byId[id];
      var col = TEAM_COLORS[id] || FALLBACK[i % FALLBACK.length];
      var nm = t.manager || t.name;
      datasets.push({
        label: nm + ' — points',
        data: points.map(function (p) {
          var v = p.s && p.s[key] && p.s[key][String(id)]; return v ? v.pts : null;
        }),
        borderColor: col.pts, backgroundColor: col.pts,
        borderWidth: 3, pointRadius: 2, pointHoverRadius: 5,
        cubicInterpolationMode: 'monotone', spanGaps: true, clip: false, yAxisID: 'y',
      });
      datasets.push({
        label: nm + ' — playoff %',
        data: points.map(function (p) {
          var v = p.s && p.s[key] && p.s[key][String(id)]; return v ? v.odds : null;
        }),
        borderColor: col.odds, backgroundColor: col.odds,
        borderWidth: 2, borderDash: [5, 4], pointRadius: 0, pointHoverRadius: 4,
        cubicInterpolationMode: 'monotone', spanGaps: true, clip: false, yAxisID: 'y1',
      });
    });

    // Fit the points axis to the teams plotted — a 100–160 span on a 0–200
    // axis is unreadable.
    var pv = [];
    datasets.forEach(function (d) {
      if (d.yAxisID !== 'y') return;
      d.data.forEach(function (v) { if (v != null) pv.push(v); });
    });
    var lo = 0, hi = 10;
    if (pv.length) {
      lo = Math.min.apply(null, pv); hi = Math.max.apply(null, pv);
      var pad = Math.max(1, (hi - lo) * 0.25);
      lo = Math.floor((lo - pad)); hi = Math.ceil((hi + pad));
      if (hi - lo < 6) { var mid = (hi + lo) / 2; lo = Math.floor(mid - 3); hi = Math.ceil(mid + 3); }
    }
    var titles = points.map(function (p) { return p.label + ' · week ' + p.week; });

    if (chart) chart.destroy();
    chart = new Chart(document.getElementById('raceChart'), {
      type: 'line',
      data: { labels: points.map(function (p) { return p.label; }), datasets: datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        layout: { padding: { top: 14, bottom: 10, left: 4, right: 6 } },
        scales: {
          y:  { position: 'left', min: lo, max: hi,
                title: { display: true, text: 'Live points', color: '#e2e8f0' },
                ticks: { color: '#cbd5e1', padding: 6 },
                grid: { color: '#1e293b' } },
          y1: { position: 'right', min: 0, max: 100,
                title: { display: true, text: 'Playoff %', color: '#94a3b8' },
                ticks: { color: '#94a3b8', stepSize: 20, padding: 6,
                         callback: function (v) { return v + '%'; } },
                grid: { drawOnChartArea: false } },
          x:  { ticks: { color: '#64748b', maxRotation: 60, autoSkip: true, maxTicksLimit: 18 },
                grid: { display: false } },
        },
        plugins: {
          legend: { labels: { color: '#cbd5e1', usePointStyle: true, pointStyle: 'line',
                              boxWidth: 26, font: { size: 11 } } },
          tooltip: {
            callbacks: {
              title: function (it) { return titles[it[0].dataIndex] || ''; },
              label: function (c) {
                if (c.parsed.y == null) return c.dataset.label + ': n/a';
                var pct = c.dataset.yAxisID === 'y1';
                return c.dataset.label + ': ' +
                  (pct ? (c.parsed.y >= 100 ? '100%' : fmtPct(c.parsed.y))
                       : fmtPts(c.parsed.y) + ' pts');
              },
            },
          },
        },
      },
    });
  }

  // ---------- matchups ---------------------------------------------------
  function stakeLine(t) {
    if (t.clinched || t.eliminated) return '';
    var need, verb;
    if (t.magic !== null && t.magic !== undefined) { need = t.magic; verb = 'clinches with'; }
    else if (t.need_alive) { need = t.need_alive; verb = 'needs'; }
    else return t.name + ' is fighting for the last spot';
    var target = need >= t.remaining
      ? 'needs all ' + t.remaining + ' left ' + (verb === 'clinches with' ? 'to clinch' : 'to stay alive')
      : verb + ' ' + need + ' of the ' + t.remaining + ' left';
    return t.name + ' ' + target + ' — ' + (t.live >= need ? 'already there' : 'leads ' + t.live);
  }

  function renderMatchups(matchups, byId, weekPct) {
    return matchups.map(function (m) {
      var a = byId[m.a.team_id], b = byId[m.b.team_id];
      if (!a || !b) return '';
      var stakes = [stakeLine(a), stakeLine(b)].filter(Boolean);
      var tied = CATS - m.decided;
      function cls(x, y) { return x > y ? 'winner' : x < y ? 'loser' : 'tied'; }
      function ipTag(t) {
        if (t.meets_min_ip === null || t.meets_min_ip === undefined) return '';
        return '<span class="mu-ip ' + (t.meets_min_ip ? 'okay' : 'short') + '">IP ' +
               esc(t.ip_raw) + (t.meets_min_ip ? '' : ' (−' + t.ip_short + ')') + '</span>';
      }
      return '<div class="mu' + (stakes.length ? ' key' : '') + '">' +
        '<div class="mu-stakes">' + esc(stakes.join(' · ') || 'No bearing on the cut line') + '</div>' +
        '<div class="mu-head">' +
          '<div class="mu-side"><span class="mu-name">' + esc(a.name) + '</span>' +
            '<span class="mu-rec">' + a.wins + '-' + a.losses + '-' + a.ties + '</span>' + ipTag(a) + '</div>' +
          '<div class="mu-score"><span class="' + cls(a.live, b.live) + '">' + a.live + '</span>' +
            '<span class="sep">–</span><span class="' + cls(b.live, a.live) + '">' + b.live + '</span></div>' +
          '<div class="mu-side r"><span class="mu-name">' + esc(b.name) + '</span>' +
            '<span class="mu-rec">' + b.wins + '-' + b.losses + '-' + b.ties + '</span>' + ipTag(b) + '</div>' +
        '</div>' +
        '<div class="mu-foot">' +
          (tied ? tied + ' categor' + (tied === 1 ? 'y' : 'ies') + ' still level'
                : 'All ' + CATS + ' categories have a leader') +
          ' · ' + weekPct + ' of the week played · nothing banks until it ends</div>' +
      '</div>';
    }).join('');
  }

  // ---------- filter bar --------------------------------------------------
  function pickNames(sel) {
    var c = DATA.current.candidate_info.filter(function (x) { return sel[x.team_id]; });
    if (!c.length) return 'nobody';
    return c.map(function (x) { return x.manager || x.name; }).join(' + ');
  }

  // One control per team that genuinely cannot reach the minimum, plus As-is
  // to clear them. Independent, because the three are separate events.
  function filterBar(sel, id) {
    var cur = DATA.current;
    // No innings data means no forfeit model. Say that, rather than offering
    // controls that silently do nothing.
    if (cur.ip_source === 'unavailable' || !cur.candidate_info ||
        !cur.candidate_info.length) {
      return '<div class="toolbar"><span class="lbl">' + cur.min_ip +
        '-IP forfeits:</span><span class="hint">' +
        (cur.ip_source === 'unavailable'
          ? 'Innings data unavailable — Yahoo has stopped serving the current ' +
            'week&rsquo;s matchup pages, which is the only place IP is published. ' +
            'Retrying every 10 minutes; the controls return the moment it does. ' +
            'Everything else on this page is unaffected.'
          : 'Nobody is far enough short of ' + cur.min_ip +
            ' to be worth modelling right now.') +
        '</span></div>';
    }
    var on = keyOf(sel) !== 'none';
    var btns = '<button class="seg' + (on ? '' : ' on') + '" data-sel="' + id +
               '" data-team="">As-is</button>';
    cur.candidate_info.forEach(function (c) {
      // No "(no effect)" label here. Whether a forfeit matters depends on which
      // categories that team leads AT THE END of the week, and it is the last
      // day - a manager leading nothing this minute can be leading three by
      // tea time. The tooltip reports the current position and says so.
      var lost = c.pit_led.length;
      btns += '<button class="seg' + (sel[c.team_id] ? ' on' : '') +
              '" data-sel="' + id + '" data-team="' + c.team_id + '"' +
              ' title="' + esc(c.name) + ' — IP ' + esc(c.ip_raw) + ', ' + c.ip_short +
              ' short of ' + cur.min_ip + '. Right now leads ' +
              (lost ? c.pit_led.length + ' pitching categor' + (lost === 1 ? 'y' : 'ies') +
                      ' (' + c.pit_led.join(', ') + ')'
                    : 'no pitching categories') +
              ', but that can change while games are still being played.' +
              '">' + esc(c.manager || c.name) + ' forfeits</button>';
    });
    return '<div class="toolbar">' +
      '<span class="lbl">' + cur.min_ip + '-IP forfeits:</span>' + btns +
      '<span class="' + (on ? 'warn' : 'hint') + '">' +
        (on ? 'Assuming ' + pickNames(sel) + ' finish' +
              (Object.keys(sel).filter(function (k) { return sel[k]; }).length === 1 ? 'es' : '') +
              ' under ' + cur.min_ip + ' IP and forfeit every pitching category they lead.'
            : 'Nobody forfeiting. Click a manager to model them missing the innings minimum.') +
      '</span></div>';
  }

  function wireFilters() {
    Array.prototype.forEach.call(document.querySelectorAll('.seg'), function (b) {
      b.onclick = function () {
        var which = this.getAttribute('data-sel') === 'f1' ? pick : pickChart;
        var team = this.getAttribute('data-team');
        if (!team) { Object.keys(which).forEach(function (k) { delete which[k]; }); }
        else if (which[team]) { delete which[team]; }
        else { which[team] = true; }
        render();
      };
    });
  }

  // ---------- assemble ---------------------------------------------------
  function render() {
    var cur = DATA.current;
    var s = scen();
    var teams = s.teams, spots = cur.playoff_spots;
    var byId = indexById(teams);
    var weekPct = Math.round(cur.week_progress * 100) + '%';
    var tracked = (DATA.tracked || []).filter(function (id) { return byId[id]; });
    document.body.className = keyOf(pick) === 'none' ? '' : 'adj';

    document.getElementById('subtitle').textContent =
      'Week ' + cur.week + ' · ' + cur.status + ' · ' + spots + '-team playoff field';

    // meets_min_ip is null when IP is unknown - only count actual shortfalls
    var short = teams.filter(function (t) { return t.meets_min_ip === false; });
    var known = teams.filter(function (t) { return t.meets_min_ip !== null &&
                                                   t.meets_min_ip !== undefined; });
    var shortTxt;
    if (!known.length) {
      shortTxt = '<span class="unk">Innings pitched unknown — not published for ' +
                 'the live week right now, so no team is being called short.</span>';
    } else if (short.length) {
      shortTxt = '<b>' + short.length + '</b> team' + (short.length === 1 ? '' : 's') +
        ' short of ' + cur.min_ip + ' IP: ' +
        short.sort(function (x, y) { return x.ip_short - y.ip_short; })
             .map(function (t) {
               return esc(t.manager || t.name) + ' <b>−' + t.ip_short + '</b>';
             }).join(', ') +
        (cur.ip_source === 'cached'
          ? ' <span class="unk">(as of ' + esc(cur.ip_as_of || '').replace('T', ' ') +
            ' — Yahoo is not serving live IP right now, so these are a floor)</span>'
          : '');
    } else {
      shortTxt = '<span class="ok">Every team has cleared ' + cur.min_ip + ' innings.</span>';
    }

    var toolbar = filterBar(pick, 'f1') +
      '<div class="short-list">' + shortTxt + '</div>';

    var chartSection = '';
    if (tracked.length) {
      chartSection =
        '<h2>3. Race Tracker</h2>' +
        filterBar(pickChart, 'f2') +
        '<div class="section-desc">' +
          tracked.map(function (id) { return esc(byId[id].manager || byId[id].name); }).join(', ') +
          ' — every 15 minutes, 11am to 10pm MT. Solid lines are live points (left axis); ' +
          'dashed, muted lines are playoff odds (right axis). ' +
          (keyOf(pickChart) === 'none' ? 'Showing as-is. '
             : 'Projected with ' + pickNames(pickChart) + ' forfeiting. ') +
          (DATA.points.length ? DATA.points.length + ' point' +
            (DATA.points.length === 1 ? '' : 's') + ' logged today.'
            : 'Tracking starts at 11am — nothing logged yet.') +
        '</div>' +
        (DATA.points.length
          ? '<div class="chart-wrap"><canvas id="raceChart"></canvas></div>'
          : '<div class="state">First tracking point lands at 11:00am MT.</div>');
    }

    document.getElementById('page').innerHTML =
      toolbar +
      '<h2>1. Live Standings</h2>' +
      '<div class="section-desc">Live order — Bank + Leading. ' +
        (keyOf(pick) === 'none'
          ? 'Exactly as Yahoo has it right now.'
          : 'Pitching categories led by ' + pickNames(pick) +
            ' have been handed to their opponent.') +
        '</div>' +
      renderStandings(teams, spots, cur.week) +
      '<h2>2. Playoff Picture</h2>' +
      '<div class="section-desc">Ordered by odds of making the field. The second figure ' +
        'on each bar is the same team under the other scenario.</div>' +
      renderPicture(spots) +
      chartSection +
      '<h2>Week ' + cur.week + ' Matchups</h2>' +
      '<div class="section-desc">Live category scores — ' + esc(cur.status) + '</div>' +
      '<div class="mu-grid">' + renderMatchups(s.matchups, byId, weekPct) + '</div>' +
      '<h2>How this is worked out</h2>' +
      '<div class="banner">' +
        '<strong>Minimum innings:</strong> a team that finishes the week under ' + cur.min_ip +
        ' innings pitched forfeits every <em>pitching</em> category it leads (' +
        cur.pitching_cats.join(', ') + ') to its opponent. If both teams in a matchup are ' +
        'short, the category goes to neither. The toggle recomputes the standings and reruns ' +
        'the full simulation under that rule — both scenarios are calculated server-side every ' +
        '10 minutes, so flipping it is instant and never an estimate.' +
        '<br><strong>Where this comes from:</strong> the Yahoo API has been dead since late July, ' +
        'so a scheduled AWS job scrapes the public league page and all six matchup pages. ' +
        'Standings are Yahoo\'s through week ' + (cur.week - 1) + ' (' + esc(cur.yahoo_updated) + '). ' +
        'Playoff odds run the rest of the season ' + cur.sims.toLocaleString() + ' times, holding ' +
        'each current lead in proportion to the ' + weekPct + ' of the week played.' +
        '<br><strong>IP notation:</strong> innings are baseball notation, not decimal — 49.1 is ' +
        '49 and 1/3 innings, so a team on 49.2 is still two outs short of 50.' +
        '<br><strong>Playoff format:</strong> ' + esc(cur.playoff_format) + '. ' +
        'Last scrape ' + esc(cur.scraped_at.replace('T', ' ')) + '.' +
      '</div>';

    wireFilters();
    if (tracked.length && DATA.points.length) drawChart(DATA.points, tracked, byId);
  }

  function fail(msg) {
    if (chart) { chart.destroy(); chart = null; }
    document.getElementById('subtitle').textContent = '2026 Season';
    document.getElementById('page').innerHTML =
      '<div class="state err">Could not load the live standings.<br>' + esc(msg) +
      '<br><button class="again" id="again">Try again</button></div>';
    document.getElementById('again').onclick = load;
  }

  function load() {
    fetch(ENDPOINT + '?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (d) { DATA = d; render(); })
      .catch(function (e) { fail(e.message || String(e)); });
  }

  load();
  setInterval(load, 5 * 60 * 1000);
})();
</script>
<script src="nav.js"></script>
</body>
</html>
